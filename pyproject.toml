[project]
name = "opportunity-engine"
version = "0.1.0"
description = "Opportunity Intelligence Automation Engine — collect, normalise, score and report commercial opportunities."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Opportunity Engine Contributors" }]
keywords = [
  "automation",
  "etl",
  "procurement",
  "opportunities",
  "fastapi",
  "scraping",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business",
]
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "email-validator>=2.2.0",
  "sqlalchemy[asyncio]>=2.0.36",
  "alembic>=1.14.0",
  "asyncpg>=0.30.0",
  "aiosqlite>=0.20.0",
  "greenlet>=3.1.0",
  "httpx>=0.27.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "feedparser>=6.0.11",
  "jinja2>=3.1.4",
  "python-multipart>=0.0.12",
  "openpyxl>=3.1.5",
  "pyyaml>=6.0.2",
  "structlog>=24.4.0",
  "tenacity>=9.0.0",
  "typer>=0.12.5",
  "rich>=13.9.0",
  "python-dateutil>=2.9.0",
  "rapidfuzz>=3.10.0",
]

[project.optional-dependencies]
orchestration = ["prefect>=3.1.0"]
analytics = ["pandas>=2.2.0"]
playwright = ["playwright>=1.48.0"]

[project.scripts]
opportunity-engine = "app.cli.main:app"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.24.0",
  "pytest-cov>=6.0.0",
  "respx>=0.21.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-pyyaml>=6.0.12",
  "types-python-dateutil>=2.9.0",
  "pandas-stubs>=2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.vercel]
entrypoint = "index.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["app"]
omit = [
  "app/cli/*",
  "app/dashboard/templates/*",
  "app/workflows/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_empty = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = ["B008", "N818", "E501", "SIM102", "SIM108", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = false
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
pretty = true
exclude = ["migrations", "scripts", "tests"]

[[tool.mypy.overrides]]
module = ["feedparser", "prefect.*", "openpyxl.*", "rapidfuzz.*"]
ignore_missing_imports = true
