services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: opportunity
      POSTGRES_PASSWORD: opportunity
      POSTGRES_DB: opportunity_engine
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opportunity -d opportunity_engine"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://opportunity:opportunity@db:5432/opportunity_engine
      LOG_LEVEL: INFO
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data/exports:/app/data/exports
      - ./config:/app/config
    command: >
      sh -c "uv run alembic upgrade head &&
             uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  postgres_data:
